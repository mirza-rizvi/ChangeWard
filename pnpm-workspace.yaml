packages:
  - "."

strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@emdash-cms/admin@1.0.1'
  - '@emdash-cms/auth@1.0.1'
  - '@emdash-cms/blocks@1.0.1'
  - '@emdash-cms/cloudflare@1.0.1'
  - '@emdash-cms/gutenberg-to-portable-text@1.0.1'
  - '@emdash-cms/plugin-cli@0.13.1'
  - '@emdash-cms/plugin-test@0.2.6'
  - '@emdash-cms/plugin-types@0.5.0'
  - '@emdash-cms/registry-client@0.7.0'
  - '@emdash-cms/registry-lexicons@0.7.0'
  - '@emdash-cms/registry-verification@0.3.3'
  - emdash@1.0.1

# Security: miniflare (EmDash test tooling) pins an undici 7.x release with known advisories.
# Dev/test only; never part of the shipped plugin.
overrides:
  'undici@>=7.0.0 <7.29.1': 7.30.0
